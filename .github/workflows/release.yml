name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Require a signed immutable release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: git verify-tag "$RELEASE_TAG"
      - name: Use an OIDC-capable npm CLI
        run: |
          npm install --global npm@11.6.2
          npm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm check
      - run: pnpm build
      - name: Pack and inspect immutable release artifacts
        run: node scripts/prepare-release-artifacts.mjs --output release-artifacts
      - name: Verify release and package versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          node -e 'const fs=require("node:fs"); const expected=process.argv[1]; const inventory=JSON.parse(fs.readFileSync("release-artifacts/package-inventory.json")); if(inventory.version!==expected) throw new Error(`Release tag ${expected} does not match package version ${inventory.version}.`)' "$VERSION"
      - name: Publish through npm trusted publishing
        run: |
          DIST_TAG="$(cat release-artifacts/dist-tag.txt)"
          for archive in release-artifacts/*.tgz; do
            npm publish "$archive" --access public --tag "$DIST_TAG" --provenance
          done
      - name: Attach checksums, inventory, and SBOM
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            release-artifacts/checksums.txt \
            release-artifacts/package-inventory.json \
            release-artifacts/sbom.spdx.json \
            --clobber
      - name: Verify registry and release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node scripts/verify-published-release.mjs release-artifacts
          ASSETS="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          grep -Fx checksums.txt <<<"$ASSETS"
          grep -Fx package-inventory.json <<<"$ASSETS"
          grep -Fx sbom.spdx.json <<<"$ASSETS"
